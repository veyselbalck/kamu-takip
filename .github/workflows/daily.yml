name: Günlük İlan Taraması

on:
  schedule:
    - cron: "0 7 * * *"   # UTC 07:00 = TR 10:00  
  workflow_dispatch: {}     # Actions sekmesinden elle başlatabilirsin

permissions:
  contents: write

concurrency:
  group: ilan-tarama
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: self-hosted    # Türkiye'deki kendi bilgisayarın (SBB / ÇŞB engeline takılmaz)
    timeout-minutes: 350
    defaults:
      run:
        shell: bash          # Windows'ta Git Bash
    steps:
      - uses: actions/checkout@v4

      - name: Bağımlılıkları kur
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Scraper'ı çalıştır
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DIAGNOSE: "1"
          PYTHONUTF8: "1"
        run: python scraper.py

      - name: Değişiklikleri commit'le
        if: always()
        run: |
          git config user.name "ilan-bot"
          git config user.email "ilan-bot@users.noreply.github.com"
          git add docs logs data
          git diff --quiet --cached || git commit -m "Günlük ilan raporu güncellendi"
          git pull --rebase -q || true
          git push
