name: Günlük İlan Taraması

on:
  schedule:
    - cron: "0 5 * * *"   # UTC 05:00 = TR saatiyle 08:00 (yaz saati farkına göre kontrol et)
  workflow_dispatch: {}     # Actions sekmesinden elle de çalıştırabilirsin

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scraper'ı çalıştır
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scraper.py

      - name: Değişiklikleri commit'le
        run: |
          git config user.name "ilan-bot"
          git config user.email "ilan-bot@users.noreply.github.com"
          git add docs/index.html logs/log.csv
          git diff --quiet --cached || git commit -m "Günlük ilan raporu güncellendi"
          git push
