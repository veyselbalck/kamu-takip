name: Günlük İlan Taraması

on:
  schedule:
    - cron: "0 7 * * *"   # UTC 07:00 = TR 10:00
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ilan-tarama
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 350
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      - name: Python yolunu ekle
        run: |
          >>"%GITHUB_PATH%" echo C:\Program Files\Python311
          >>"%GITHUB_PATH%" echo C:\Program Files\Python311\Scripts

      - name: Python kontrolü
        run: |
          whoami
          where python
          python --version

      - name: Bağımlılıkları kur
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Scraper'ı çalıştır
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DIAGNOSE: "1"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python scraper.py

      - name: Değişiklikleri commit'le
        if: always()
        run: |
          git config user.name "ilan-bot"
          git config user.email "ilan-bot@users.noreply.github.com"
          git add docs logs data
          git diff --quiet --cached || git commit -m "Günlük ilan raporu güncellendi"
          git pull --rebase -q
          git push
